name: Java CI

on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 11
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest-11-arm64
      max-parallel: 16
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }} [${{ matrix.expander_leg
      }}]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
          # Temurin publishes no Windows arm64 build for JDK 11; Microsoft's OpenJDK build has a native one
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java != '8') && 'microsoft' || 'temurin' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Build with Maven if test jdk8
      if: ${{ matrix.java == '8' || matrix.java == '11'}}
      run: ./mvnw -Pgen-javadoc clean package -B
    - name: Build with Maven if test jdk17
      if: ${{ matrix.java == '17' || matrix.java == '21' }}
      run: ./mvnw -Penable-for-jdk17+,gen-code-cov clean package -B
    - name: "Codecov if test jdk17"
      if: ${{ matrix.java == '17' }}
      uses: codecov/codecov-action@v3.1.0
      with:
        files: 
          ./core/target/site/jacoco/jacoco.xml,./druid-spring-boot-starter/target/site/jacoco/jacoco.xml,./druid-spring-boot-3-starter/target/site/jacoco/jacoco.xml
    timeout-minutes: 150
